<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>scribeaside test harness</title>
  <style>
    html, body {
                              margin: 0;
                              padding: 0;
                              height: 100vh;
                              display: flex;
                              flex-direction: column;
                              --vscode-editor-background: #1e1e1e;
                              --vscode-editor-foreground: #d4d4d4;
                              --vscode-font-family: sans-serif;
                              --vscode-font-size: 13px;
                              --vscode-editor-selectionBackground: #264f78;
                              --vscode-editorLineNumber-foreground: #858585;
                              --vscode-editor-font-family: monospace;
                              background: var(--vscode-editor-background);
                              color: var(--vscode-editor-foreground);
                              font-family: var(--vscode-font-family);
                              font-size: var(--vscode-font-size);
                            }
                            #editor {
                              flex: 1;
                              min-height: 0;
                              display: flex;
                              flex-direction: column;
                            }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script>
    window.__postedMessages = []
                            // Backed by sessionStorage so that reloading the
                            // page reproduces what VS Code does to a sidebar
                            // webview on collapse: the document is destroyed,
                            // and setState/getState is the only thing that
                            // survives it.
                            const STATE_KEY = 'scribeaside.harnessState'
                            window.acquireVsCodeApi = () => ({
                              postMessage: (msg) => {
                                window.__postedMessages.push(msg)
                              },
                              getState: () => {
                                const raw = sessionStorage.getItem(STATE_KEY)
                                return raw ? JSON.parse(raw) : undefined
                              },
                              setState: (state) => {
                                sessionStorage.setItem(STATE_KEY, JSON.stringify(state))
                              },
                            })
  </script>
  <script src="/dist/webview.js"></script>
</body>
</html>
